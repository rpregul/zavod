<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Проверка оплаты</title><link rel="stylesheet" href="css/app.css?v=1.13.0"><main id="app"><h1>Проверка оплаты</h1><p>Реальный магазин. Для проверки перехода закройте ЮKassa до подтверждения платежа.</p><button class="btn btn--glass" id="open">Открыть форму оплаты</button><p role="status" id="status"></p></main><div id="sheet-root"></div><div id="toast-root"></div><script type="module">
import { billingRequest } from './js/billing-api.js?v=1.5.0';
import { openSubscription } from './js/subscription.js?v=1.12.0';
const button = document.querySelector('#open');
const status = document.querySelector('#status');
const secret = location.hash.slice(1);
let token;
async function show() {
  if (!/^[a-f0-9]{64}$/.test(secret)) { status.textContent='Откройте персональную ссылку для проверки.'; return; }
  button.disabled=true;
  try {
    if (!token) {
      const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(secret))), b=>b.toString(16).padStart(2,'0')).join('');
      const result=await billingRequest('login',{name:'__qa_checkout_'+hash.slice(0,12),hash:secret,create:true});
      if (!result.token) throw Error();
      token=result.token;
    }
    const billing=(action,data)=>billingRequest(action,data,token);
    await openSubscription({billing,refreshAccess:()=>billing('status')},{plan:'individual'});
    status.textContent='';
  } catch {status.textContent='Не удалось открыть форму. Попробуйте ещё раз.';}
  finally {button.disabled=false;}
}
button.onclick=show;
show();
</script></html>
